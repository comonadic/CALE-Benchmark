notes: 卡片限定资料清单及缺口维护，不扩展为材料不足时仍出完整并购法律意见。状态字段是本卡整理约定，不声称四档状态为通行法定标准。选择Excel本地文件版本；Ideals文档用于证明真实工作方式，不要求开通或分享线上数据室。耗时及文件名为研究估计及建议；未部署环境。

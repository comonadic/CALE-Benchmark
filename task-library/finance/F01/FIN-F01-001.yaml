task_type_id: FIN-F01-001
industry: finance
work_family: F01 上市公司研究与股票分析
title: 根据最新财报更新三表联动预测模型
role: 企业财务分析师或股票研究分析师
trigger: 新一期财报或经营预算发布，需要更新历史期间、经营假设和预测三表，供业务或投资决策使用
expert_time_estimate: 120-240 min（研究者估计，限单一公司的有限期间模型更新）
workflow_steps:
  - 对照新旧财报和附注，将历史数录入模型，核对币种、单位、合并范围和重述期间。
  - 计算历史收入增长、利润率和营运资金周转指标，更新有来源的经营假设。
  - 在 Excel 中更新收入、成本和营运资金预测，并区分历史实绩与预测。
  - 更新固定资产、资本开支、折旧、债务和权益支持表。
  - 将支持表连接至利润表、现金流量表和资产负债表，检查期末现金与留存收益的衔接。
  - 改变一个经营假设，复核三表联动，并排查资产负债不平衡、错误引用和不合理硬编码。
  - 保存可编辑模型及关键假设、预测结果和差异的说明。
software:
  - name: Microsoft Excel
    use: 打开并修改既有模型，维护支持表和公式，重算三表及情景结果
    provision: cua
deliverables:
  - {file: three_statement_model.xlsx, form: 含历史、假设、支持表、联动三表及勾稽检查的可编辑模型}
  - {file: model_update_notes.pdf, form: 从模型说明页导出的关键假设及更新说明}
verification:
  profession_checks:
    - 历史披露与预测分开，口径变化和重述有明确记录。
    - 营运资金、固定资产和债务支持表实际驱动三表，而非复制最终数值。
    - 现金流净变动与现金余额、净利润与权益变化具有可复算的衔接。
    - 修改经营假设后，相关支持表和输出同时重算。
  objective_parts:
    - 历史金额和来源页码、币种、单位、期间的一致性。
    - 资产等于负债加权益，现金期初加变动等于期末。
    - 固定资产、债务和权益期初至期末的滚动计算。
    - 输入变化后的公式联动、引用有效性和舍入容差。
  rubric_parts:
    - 预测假设与历史经营、业务解释及可得信息的匹配程度。
    - 对异常指标和模型限制的说明是否有证据。
input_data:
  - {kind: 同一公司的多期财报、附注及更正公告, point_in_time: 更新截止日已公开版本, source_hint: S01 巨潮资讯或 S05 全国股转系统}
  - {kind: 既有三表模型和经授权的经营预算或预测假设, point_in_time: 更新前模型及当前批准版本, source_hint: 委托方业务底稿，不能由作者替代缺失事实}
  - {kind: 债务、资本开支及分红的相关披露, point_in_time: 与模型更新截止日一致, source_hint: S01、S06 上海清算所或委托方台账}
fusable_with:
  - {id: FIN-F03-002, relation: downstream, note: 仅在同一借款人、同一信息截止日且包含授信所需经营和融资底稿时，模型中的营运资金、债务及现金流支持表进入流贷需求复核。}

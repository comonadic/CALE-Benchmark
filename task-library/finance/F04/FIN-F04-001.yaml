notes: 本卡为从零调研的工作类型，不绑定原 pilot。两份监管通知来自同一发布体系，只计一组独立来源；券商原始报告为第二组。北京2022年的每月20日与新疆2026年的每月10日是各自条件，不能推广为统一期限。公开报告仅保存链接和摘要，实例化前检查原件授权。耗时与文件名为研究估计及建议。

task_type_id: FIN-F02-001
industry: finance
work_family: F02 IPO、再融资与并购投行
title: IPO审核材料跨文件一致性核查与问询回复底稿
role: 保荐机构项目组（投行分析师/律师）
trigger: 交易所下发首轮或后续轮次问询函，发行人与中介机构联合准备回复，需在提交前完成四方（发行人/保荐机构/律师/会计师）联合核稿
expert_time_estimate: 120-240 min（单轮问询中一个专题的核查底稿）
workflow_steps:
  - 拆解问询函：识别每个问题的核查维度（财务数据/关联交易/法律权属/披露一致性）
  - 确定需要跨文件比对的文件对：招股书 ↔ 审计报告 ↔ 法律意见书 ↔ 上轮问询回复
  - 按问题建立底稿索引表：问题编号/核查事项/引用文件/页码/结论/责任方
  - 针对财务数据核查：从审计报告原始数值出发，追溯至招股书对应披露位置，记录差异
  - 针对关联交易核查：律师底稿与审计报告交叉印证；律师未覆盖但审计列示的事项补充材料；审计未列示但律师已核查的事项与审计师确认
  - 整理网查证据：工商登记截图（记录查询时间、方式与内容）、司法拍卖/诉讼查询记录
  - 起草问询回复相关章节，四方会签前完成内部质控核查（保荐机构质控部门审阅底稿目录与索引表）
  - 出具核查底稿：合同/银行流水/会计凭证/访谈笔录/声明/评估及审计文件分类归档
software:
  - {name: Excel, use: 底稿索引表/差异台账/跨文件数据勾稽, provision: container}
  - {name: Word, use: 问询回复草稿与核查说明, provision: container}
  - {name: PDF阅读器, use: 招股书/审计报告/法律意见书原文定位, provision: container}
deliverables:
  - {file: cross_check_index.xlsx, form: 底稿索引表，含问题编号/核查事项/引用文件/页码/结论}
  - {file: discrepancy_ledger.xlsx, form: 差异台账，列出各文件间不一致项与处置结论}
  - {file: inquiry_response_draft.docx, form: 问询回复草稿，含四方核查结论及证据索引}
verification:
  profession_checks:
    - 每个问询子问题均有对应底稿条目，无遗漏覆盖
    - 财务数据引用可追溯至审计报告原始数值（页码可核对）
    - 关联交易双向核查：律师侧与审计侧均有记录或有协商确认的解释
    - 网查截图记录查询时间戳，不是过期截图
    - 回复结论与底稿证据一致（不出现回复说"不存在"但底稿有发现的情况）
  objective_parts:
    - 底稿索引表覆盖率（问询子问题数 vs 有底稿条目数）
    - 数据引用页码准确性（可按页码定位到原文对应数字）
    - 差异项处置结论是否均有明确说明（不留空白或"待确认"）
  rubric_parts:
    - 核查结论的逻辑充分性（是否说清楚为何差异不构成实质性问题）
    - 底稿证据链的完整性（来源多样性，不单依赖自述）
input_data:
  - {kind: 招股说明书（含历史版本）, point_in_time: 报告期内有效版本, source_hint: S02 上交所/S03 深交所/S04 北交所}
  - {kind: 审计报告及财务报表, point_in_time: 报告期末, source_hint: S02 S03 S04}
  - {kind: 法律意见书及律师工作报告, point_in_time: 审核阶段, source_hint: S02 S03 S04}
  - {kind: 历轮问询函及回复文件, point_in_time: 各轮披露版本, source_hint: S02 S03 S04}
fusable_with:
  - {id: FIN-F17-001, relation: upstream, note: 财务数据勾稽可与审计差异调整工作表融合，须同主体同材料}
